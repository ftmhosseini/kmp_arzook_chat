server.port=8080
spring.application.name=arzook-websocket-server

# ─────────────────────────────────────────────────────────────────────────────
# JWT Secret — MUST match the secret used by the main Arzook backend
# Replace this with the real secret before handing off to the backend team
# Must be Base64-encoded, minimum 32 bytes
# ─────────────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}

# Logging
logging.level.ca.arzook=DEBUG
logging.level.org.springframework.web.socket=INFO
